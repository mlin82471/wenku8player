<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wenku8 Desktop Island</title>
  <link rel="stylesheet" href="css/island.css?v=3.2">
</head>
<body class="desktop-island-body">

<div class="island-stage" data-tauri-drag-region id="islandStage">
  <div class="island" id="islandEl" data-tauri-drag-region>
    <!-- 动态微光与边缘光晕 -->
    <div class="island-glow" id="islandGlow"></div>

    <!-- 1. 紧凑胶囊态 (Idle / Playing) -->
    <div class="island-compact" id="islandCompact" data-tauri-drag-region>
      <!-- 左侧：待机呼吸点 / 播放时微缩黑胶封面 -->
      <div class="compact-left">
        <span class="compact-idle-dot" id="compactIdleDot"></span>
        <div class="compact-cover-wrap" id="compactCoverWrap">
          <img class="compact-cover-img" id="compactCoverImg" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23222' width='100' height='100'/><text y='.75em' font-size='60' x='20'>📼</text></svg>" alt="">
        </div>
      </div>

      <!-- 中间：歌名艺人单行滚动 -->
      <div class="compact-center" data-tauri-drag-region>
        <div class="compact-title" id="compactTitle">Wenku8 Audio</div>
      </div>

      <!-- 右侧：跳动青绿声学音浪 -->
      <div class="compact-right">
        <div class="compact-waves" id="compactWaves">
          <span class="w-bar"></span>
          <span class="w-bar"></span>
          <span class="w-bar"></span>
          <span class="w-bar"></span>
        </div>
      </div>
    </div>

    <!-- 2. 悬停展开微卡片态 (Hover Full - 320x80 小巧精致) -->
    <div class="island-full" id="islandFull">
      <!-- 顶部信息行：40px 封面 + 标题歌手 + Vidstack 控制按钮 -->
      <div class="full-top-row">
        <!-- 40px 专辑封面（点击直接唤回主窗口大播放层） -->
        <div class="full-cover-wrap" id="fullCoverBtn" title="点击直接进入播放层">
          <img class="full-cover-img" id="fullCoverImg" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23222' width='100' height='100'/><text y='.75em' font-size='60' x='20'>📼</text></svg>" alt="">
          <div class="full-cover-overlay">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M15 3l6 6-6 6M21 9H9a5 5 0 0 0-5 5v7"/></svg>
          </div>
        </div>

        <!-- 歌曲名、歌手 -->
        <div class="full-info-col" data-tauri-drag-region>
          <div class="full-title-line">
            <span class="full-title" id="fullTitle">Wenku8 Audio</span>
            <span class="platform-badge" id="platformBadge">网易云</span>
          </div>
          <div class="full-artist" id="fullArtist">纯净音乐典藏</div>
        </div>

        <!-- 极简控制按钮组 -->
        <div class="compact-controls-right">
          <button class="vds-btn" id="btnPrev" title="上一首">
            <svg viewBox="0 0 32 32" width="13" height="13" fill="currentColor"><path d="M8 8H11V24H8V8ZM24 8.5L13 16L24 23.5V8.5Z"/></svg>
          </button>
          <button class="vds-btn vds-play-btn" id="btnPlayPause" title="播放 / 暂停">
            <svg id="svgPlay" viewBox="0 0 32 32" width="14" height="14" fill="currentColor"><path d="M10 7.5L25 16L10 24.5V7.5Z"/></svg>
            <svg id="svgPause" viewBox="0 0 32 32" width="14" height="14" fill="currentColor" style="display:none;"><path d="M9 7H13V25H9V7ZM19 7H23V25H19V7Z"/></svg>
          </button>
          <button class="vds-btn" id="btnNext" title="下一首">
            <svg viewBox="0 0 32 32" width="13" height="13" fill="currentColor"><path d="M8 8.5L19 16L8 23.5V8.5ZM21 8H24V24H21V8Z"/></svg>
          </button>
          <button class="vds-btn vds-action-btn" id="btnRestoreMain" title="唤回完整播放器">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          </button>
        </div>
      </div>

      <!-- 底部行：进度条与时间戳 -->
      <div class="full-progress-row">
        <span class="time-label" id="timeCurrent">00:00</span>
        <div class="progress-track-wrap" id="progressTrackWrap">
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
          </div>
        </div>
        <span class="time-label" id="timeTotal">00:00</span>
      </div>
    </div>
  </div>
</div>

<script src="js/island.js?v=3.2"></script>
</body>
</html>
