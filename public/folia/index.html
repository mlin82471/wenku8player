    <meta charset="UTF-8" />

    <title>Classic Standalone · Folia</title>
    <style>
      html,body,#root{background:#0a0a0c;width:100%;height:100%;margin:0;padding:0;overflow:hidden}
      /* 针对性屏蔽 Folia 内部遗留的设置窗口与对话框，避免影响动效正常渲染 */
      .st-window, [data-folia-sheet], [data-folia-keyboard-window], [data-ponder] {
        display: none !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 彻底拦截右键上下文菜单事件，防止唤出 Folia 内部设置对话框
      window.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        e.stopPropagation();
      }, true);
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        e.stopPropagation();
      }, true);

      // 清除并注销任何残留的 Service Worker 与离线缓存，杜绝页面被劫持为在线书架
      try {
        if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          });
        }
        if (typeof window !== 'undefined' && window.caches) {
          caches.keys().then(function (ks) {
            ks.forEach(function (k) { caches.delete(k); });
          });
        }
      } catch (_) {}
    </script>
